# NexLink with its database, for a single server you control.
#
#   PUBLIC_URL=https://nexlink.example.com docker compose up -d --build
#
# Put HTTPS in front (Caddy, nginx, a cloud load balancer) and point
# PUBLIC_URL at it: invited computers reach the portal, the API and the relay
# through that one address, from any network.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexlink:
    build: .
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/nexlink
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # AI is built in: a Groq key is all it needs.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DIAGNOSTIC_SERVICE_URL: ${DIAGNOSTIC_SERVICE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  # Optional, not needed: the separate Python AI service. NexLink has the same
  # provider built in (GROQ_API_KEY above); use this only to run AI elsewhere.
  diagnostic-service:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && uvicorn app.api.main:app --host 0.0.0.0 --port 8090"
    environment:
      NEXLINK_DIAG_PROVIDER: ${NEXLINK_DIAG_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./diagnostic-service:/app
    profiles: ["ai"]

volumes:
  mongo-data:
